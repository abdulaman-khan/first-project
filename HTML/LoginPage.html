<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
  </head>
  <body>
    <fieldset style="margin: 25px 0" style="padding: 20px">
      <legend><strong>Login Page</strong></legend>
      <form action="/Jan28 and June batch/FrontEnd/HTML/StudentForm.html">
        <table>
          <tr>
            <td><label for="username">UserName:</label></td>
            <td><input type="text" id="username" placeholder="username" required /></td>
          </tr>
          <tr>
            <td><label for="password">Password:</label></td>
            <td>
              <input type="password" id="password" placeholder="password" required />
            </td>
          </tr>
          <tr>
            <td>
              <input type="Submit" value="Login" />
            </td>
            <td>
              <input type="Submit" value="Forgotten password" />
            </td>
          </tr>
        </table>
      </form>
      <form action="/Jan28 and June batch/FrontEnd/HTML/signupPage.html">
        <tr>
            <td><input type="submit" value="Sign-Up"></td>
        </tr>
      </form>
    </fieldset>
  </body>
</html>
